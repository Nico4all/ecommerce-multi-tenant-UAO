name: variedades-los-primos-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: variedades-los-primos-app
    restart: unless-stopped
    working_dir: /app
    command: >-
      sh -c "npm run db:generate && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://root:docker@database:3306/project-variedadeslosprimos}
      NODE_ENV: development
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${HOST_MACHINE_APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    networks:
      - apps_mind_net

volumes:
  app_node_modules:
  app_next_cache:

networks:
  apps_mind_net:
    external: true
